# Enterprise DevSecOps Pipeline Configuration
# Centralized configuration for all pipeline components

# Global Pipeline Settings
global:
  pipeline_name: "Enterprise DevSecOps Pipeline"
  version: "1.0.0"
  environment: "production"
  
  # Quality Gates
  quality_gates:
    test_coverage_threshold: 80
    security_score_threshold: 80
    vulnerability_threshold: "medium"
    compliance_score_threshold: 85
    
  # Notifications
  notifications:
    email:
      enabled: true
      recipients:
        - "devsecops@company.com"
        - "security@company.com"
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
    teams:
      enabled: true
      webhook_url: "${TEAMS_WEBHOOK_URL}"

# Application Pipeline Configuration
application:
  # Build Configuration
  build:
    docker:
      registry: "${DOCKER_REGISTRY}"
      image_prefix: "company"
      cache_enabled: true
      multi_stage: true
      security_scanning: true
      
    languages:
      - name: "nodejs"
        versions: ["18.x", "20.x"]
        package_manager: "npm"
        test_framework: "jest"
        
      - name: "python"
        versions: ["3.9", "3.10", "3.11"]
        package_manager: "pip"
        test_framework: "pytest"
        
      - name: "java"
        versions: ["11", "17"]
        package_manager: "maven"
        test_framework: "junit"
        
      - name: "golang"
        versions: ["1.19", "1.20", "1.21"]
        package_manager: "go mod"
        test_framework: "testing"

  # Testing Configuration
  testing:
    unit_tests:
      enabled: true
      coverage_required: true
      timeout_minutes: 30
      
    integration_tests:
      enabled: true
      timeout_minutes: 60
      
    e2e_tests:
      enabled: true
      timeout_minutes: 120
      browser: "chrome"
      
    performance_tests:
      enabled: true
      tool: "k6"
      threshold_p95: 2000  # ms

  # Security Configuration
  security:
    sast:
      enabled: true
      tools:
        - name: "sonarqube"
          quality_gate: true
        - name: "semgrep"
          rules: ["security-audit", "secrets", "owasp-top-ten"]
        - name: "codeql"
          languages: ["javascript", "python", "java"]
          
    dast:
      enabled: true
      tools:
        - name: "zap"
          scan_type: "full"
          baseline: true
        - name: "burp"
          scan_type: "crawl"
          
    sca:
      enabled: true
      tools:
        - name: "trivy"
          severity: ["HIGH", "CRITICAL"]
        - name: "snyk"
          threshold: "high"
        - name: "dependency-check"
          
    container_security:
      enabled: true
      tools:
        - name: "trivy"
          severity: ["HIGH", "CRITICAL"]
        - name: "snyk"
          threshold: "high"
        - name: "clair"
          
    secret_detection:
      enabled: true
      tools:
        - name: "trufflehog"
        - name: "gitguardian"
        - name: "detect-secrets"

# Infrastructure Pipeline Configuration
infrastructure:
  # Terraform Configuration
  terraform:
    version: "1.5.0"
    backend:
      type: "s3"
      bucket: "${TF_STATE_BUCKET}"
      region: "${AWS_REGION}"
      
    workspaces:
      - name: "dev"
        environment: "development"
      - name: "staging"
        environment: "staging"
      - name: "production"
        environment: "production"
        
    security:
      checkov:
        enabled: true
        framework: "terraform"
        severity: ["HIGH", "CRITICAL"]
        
      tfsec:
        enabled: true
        severity: ["HIGH", "CRITICAL"]
        
      trivy:
        enabled: true
        scan_type: "config"
        severity: ["HIGH", "CRITICAL"]

  # Kubernetes Configuration
  kubernetes:
    version: "1.27"
    security:
      kubeval:
        enabled: true
        schema_location: "https://kubernetesjsonschema.dev"
        
      kubesec:
        enabled: true
        severity: ["HIGH", "CRITICAL"]
        
      trivy:
        enabled: true
        scan_type: "config"

  # CloudFormation Configuration
  cloudformation:
    validation:
      enabled: true
      linting: true
      
    security:
      cfn_nag:
        enabled: true
        severity: ["HIGH", "CRITICAL"]

# Security Pipeline Configuration
security:
  # Vulnerability Management
  vulnerability_management:
    thresholds:
      critical: 0
      high: 5
      medium: 20
      low: 50
      
    remediation:
      auto_fix: false
      manual_review: true
      sla_hours:
        critical: 24
        high: 72
        medium: 168
        low: 720

  # Compliance Configuration
  compliance:
    frameworks:
      soc2:
        enabled: true
        type: "Type II"
        controls: ["security", "availability"]
        
      pci_dss:
        enabled: true
        version: "4.0"
        scope: "SAQ A"
        
      gdpr:
        enabled: true
        data_processing: true
        data_protection: true
        
      iso27001:
        enabled: true
        controls: ["A.5", "A.6", "A.8", "A.9", "A.12", "A.13", "A.14", "A.15", "A.16", "A.17", "A.18"]

  # Security Monitoring
  monitoring:
    dashboards:
      enabled: true
      tools:
        - name: "grafana"
          url: "${GRAFANA_URL}"
        - name: "datadog"
          api_key: "${DATADOG_API_KEY}"
          
    alerting:
      enabled: true
      channels:
        - type: "email"
          recipients: ["security@company.com"]
        - type: "slack"
          channel: "#security-alerts"
        - type: "pagerduty"
          service_key: "${PAGERDUTY_SERVICE_KEY}"

# Deployment Configuration
deployment:
  # Environment Configuration
  environments:
    dev:
      name: "Development"
      auto_deploy: true
      approval_required: false
      security_scanning: true
      
    staging:
      name: "Staging"
      auto_deploy: false
      approval_required: true
      security_scanning: true
      performance_testing: true
      
    production:
      name: "Production"
      auto_deploy: false
      approval_required: true
      security_scanning: true
      compliance_checking: true
      rollback_enabled: true

  # Deployment Strategies
  strategies:
    blue_green:
      enabled: true
      health_check_timeout: 300
      rollback_threshold: 5
      
    canary:
      enabled: true
      percentage: 10
      duration_minutes: 30
      
    rolling:
      enabled: true
      max_surge: 1
      max_unavailable: 0

  # Monitoring Configuration
  monitoring:
    health_checks:
      enabled: true
      endpoints:
        - path: "/health"
          timeout: 30
        - path: "/ready"
          timeout: 30
        - path: "/metrics"
          timeout: 30
          
    metrics:
      enabled: true
      collection_interval: 60
      retention_days: 90

# Cost Optimization Configuration
cost_optimization:
  enabled: true
  
  # Cost Analysis
  analysis:
    infracost:
      enabled: true
      currency: "USD"
      
    aws_cost_explorer:
      enabled: true
      granularity: "MONTHLY"
      
  # Alerts
  alerts:
    budget_threshold: 10  # percentage increase
    notification_channels:
      - "email"
      - "slack"

# Documentation Configuration
documentation:
  auto_generate: true
  
  reports:
    security:
      enabled: true
      format: ["html", "pdf", "json"]
      
    compliance:
      enabled: true
      format: ["html", "pdf", "json"]
      
    cost:
      enabled: true
      format: ["html", "pdf", "json"]

# Integration Configuration
integrations:
  # Version Control
  git:
    provider: "github"  # or "gitlab", "azure"
    webhook_enabled: true
    branch_protection: true
    
  # Container Registry
  registry:
    type: "ecr"  # or "acr", "gcr", "dockerhub"
    scanning_enabled: true
    
  # Artifact Storage
  artifacts:
    type: "s3"  # or "azure", "gcs"
    retention_days: 90
    
  # Secrets Management
  secrets:
    type: "aws-secrets-manager"  # or "azure-key-vault", "hashicorp-vault"
    rotation_enabled: true
    
  # Monitoring
  monitoring:
    type: "cloudwatch"  # or "azure-monitor", "stackdriver"
    log_retention_days: 365
    
  # Alerting
  alerting:
    type: "sns"  # or "azure-service-bus", "pubsub"
    channels: ["email", "slack", "teams"]

# Performance Configuration
performance:
  # Pipeline Performance
  pipeline:
    timeout_minutes: 120
    parallel_jobs: 10
    resource_limits:
      cpu: "4"
      memory: "8Gi"
      
  # Build Performance
  build:
    cache_enabled: true
    parallel_builds: 5
    build_timeout_minutes: 60
    
  # Test Performance
  test:
    parallel_execution: true
    test_timeout_minutes: 30
    coverage_timeout_minutes: 10

# Compliance and Governance
governance:
  # Access Control
  access_control:
    role_based_access: true
    least_privilege: true
    access_reviews: true
    
  # Audit Logging
  audit_logging:
    enabled: true
    retention_days: 2555  # 7 years
    
  # Data Protection
  data_protection:
    encryption_at_rest: true
    encryption_in_transit: true
    data_classification: true
    
  # Change Management
  change_management:
    approval_workflow: true
    change_documentation: true
    rollback_procedures: true 