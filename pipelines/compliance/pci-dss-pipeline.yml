# PCI DSS Compliance Pipeline Template
# Automated compliance checking and reporting for PCI DSS framework

name: PCI DSS Compliance Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.tf'
      - '**/*.json'
      - '**/*.py'
      - '**/*.js'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily compliance scan at 6 AM UTC
  workflow_dispatch:
    inputs:
      compliance_scope:
        description: 'PCI DSS requirement scope to check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - build_and_maintain
          - protect_cardholder_data
          - maintain_vulnerability_management
          - implement_access_controls
          - monitor_and_test_networks
          - maintain_info_security_policy

env:
  COMPLIANCE_FRAMEWORK: 'PCI_DSS'
  COMPLIANCE_VERSION: '4.0'
  REPORT_FORMAT: 'json'

jobs:
  # PCI DSS Requirement 1: Build and Maintain a Secure Network
  requirement-1:
    name: Build and Maintain a Secure Network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check Firewall Configuration
        run: |
          # Check security groups for proper configuration
          aws ec2 describe-security-groups --query 'SecurityGroups[?IpPermissions[?IpRanges[?CidrIp==`0.0.0.0/0`]]]'
          
          # Check for default security groups
          aws ec2 describe-security-groups --filters "Name=group-name,Values=default" --query 'SecurityGroups'

      - name: Check Network Segmentation
        run: |
          # Check VPC configuration
          aws ec2 describe-vpcs --query 'Vpcs'
          
          # Check subnet configuration
          aws ec2 describe-subnets --query 'Subnets[?MapPublicIpOnLaunch==`true`]'

      - name: Check Router Configuration
        run: |
          # Check route tables
          aws ec2 describe-route-tables --query 'RouteTables'
          
          # Check internet gateways
          aws ec2 describe-internet-gateways --query 'InternetGateways'

      - name: Upload requirement 1 results
        uses: actions/upload-artifact@v4
        with:
          name: pci-requirement-1-results
          path: requirement-1-report.json

  # PCI DSS Requirement 2: Protect Cardholder Data
  requirement-2:
    name: Protect Cardholder Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check Data Encryption
        run: |
          # Check S3 bucket encryption
          aws s3api list-buckets --query 'Buckets[].Name' --output text | xargs -I {} aws s3api get-bucket-encryption --bucket {}
          
          # Check RDS encryption
          aws rds describe-db-instances --query 'DBInstances[?StorageEncrypted==`false`]'
          
          # Check EBS encryption
          aws ec2 describe-volumes --query 'Volumes[?Encrypted==`false`]'

      - name: Check Key Management
        run: |
          # Check KMS key rotation
          aws kms list-keys --query 'Keys' | jq '.[] | select(.KeyManager == "CUSTOMER")' | xargs -I {} aws kms describe-key --key-id {}
          
          # Check key policies
          aws kms list-keys --query 'Keys' | jq '.[] | select(.KeyManager == "CUSTOMER")' | xargs -I {} aws kms get-key-policy --key-id {} --policy-name default

      - name: Check Data Classification
        run: |
          # Check for data classification tags
          aws resourcegroupstaggingapi get-resources --resource-type-filters s3 --query 'ResourceTagMappingList[?Tags[?Key==`DataClassification`]]'
          
          # Check for PII data detection
          aws macie2 list-classification-jobs --query 'classificationJobSummaries'

      - name: Upload requirement 2 results
        uses: actions/upload-artifact@v4
        with:
          name: pci-requirement-2-results
          path: requirement-2-report.json

  # PCI DSS Requirement 3: Maintain Vulnerability Management
  requirement-3:
    name: Maintain Vulnerability Management
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run vulnerability scans
        run: |
          # Run Trivy vulnerability scanner
          trivy fs . --format json --output trivy-results.json
          
          # Run Snyk vulnerability scan
          snyk test --json --output-file snyk-results.json

      - name: Check patch management
        run: |
          # Check for outdated packages
          npm audit --json > npm-audit-results.json
          
          # Check for security updates
          pip list --outdated --format json > pip-outdated-results.json

      - name: Check security configurations
        run: |
          # Check for security misconfigurations
          python scripts/compliance/check_security_configs.py --framework PCI_DSS

      - name: Upload requirement 3 results
        uses: actions/upload-artifact@v4
        with:
          name: pci-requirement-3-results
          path: |
            trivy-results.json
            snyk-results.json
            npm-audit-results.json
            pip-outdated-results.json

  # PCI DSS Requirement 4: Implement Strong Access Controls
  requirement-4:
    name: Implement Strong Access Controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check IAM Access Controls
        run: |
          # Check for least privilege access
          aws iam get-account-authorization-details --query 'UserDetailList[?AttachedManagedPolicies[?PolicyArn==`arn:aws:iam::aws:policy/AdministratorAccess`]]'
          
          # Check for MFA enforcement
          aws iam get-account-summary --query 'SummaryMap.MFADevices'
          
          # Check for password policy
          aws iam get-account-password-policy

      - name: Check Application Access Controls
        run: |
          # Check for authentication mechanisms
          aws cognito-idp list-user-pools --max-items 10 --query 'UserPools'
          
          # Check for authorization controls
          aws iam list-policies --scope Local --query 'Policies[?PolicyName==`*PCI*`]'

      - name: Check Physical Access Controls
        run: |
          # Check for data center access logs
          aws cloudtrail describe-trails --query 'trailList'
          
          # Check for access logging
          aws s3api list-buckets --query 'Buckets[].Name' --output text | xargs -I {} aws s3api get-bucket-logging --bucket {}

      - name: Upload requirement 4 results
        uses: actions/upload-artifact@v4
        with:
          name: pci-requirement-4-results
          path: requirement-4-report.json

  # PCI DSS Requirement 5: Monitor and Test Networks
  requirement-5:
    name: Monitor and Test Networks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check Network Monitoring
        run: |
          # Check CloudWatch alarms
          aws cloudwatch describe-alarms --query 'MetricAlarms[?StateValue==`ALARM`]'
          
          # Check VPC Flow Logs
          aws ec2 describe-flow-logs --query 'FlowLogs'
          
          # Check network ACLs
          aws ec2 describe-network-acls --query 'NetworkAcls'

      - name: Check Intrusion Detection
        run: |
          # Check GuardDuty findings
          aws guardduty list-findings --detector-id $(aws guardduty list-detectors --query 'DetectorIds[0]' --output text) --query 'FindingIds'
          
          # Check WAF rules
          aws wafv2 list-web-acls --scope REGIONAL --query 'WebACLs'

      - name: Check Penetration Testing
        run: |
          # Check for recent security assessments
          aws inspector list-assessment-runs --query 'assessmentRunArns'
          
          # Check for vulnerability assessments
          aws inspector list-findings --query 'findingArns'

      - name: Upload requirement 5 results
        uses: actions/upload-artifact@v4
        with:
          name: pci-requirement-5-results
          path: requirement-5-report.json

  # PCI DSS Requirement 6: Maintain Information Security Policy
  requirement-6:
    name: Maintain Information Security Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check Security Policies
        run: |
          # Check for security policy documentation
          python scripts/compliance/check_security_policies.py --framework PCI_DSS
          
          # Check for incident response procedures
          python scripts/compliance/check_incident_response.py

      - name: Check Security Awareness
        run: |
          # Check for security training records
          python scripts/compliance/check_security_training.py
          
          # Check for security awareness programs
          python scripts/compliance/check_security_awareness.py

      - name: Check Risk Assessment
        run: |
          # Check for risk assessment documentation
          python scripts/compliance/check_risk_assessment.py --framework PCI_DSS
          
          # Check for risk mitigation strategies
          python scripts/compliance/check_risk_mitigation.py

      - name: Upload requirement 6 results
        uses: actions/upload-artifact@v4
        with:
          name: pci-requirement-6-results
          path: requirement-6-report.json

  # PCI DSS Compliance Reporting
  pci-compliance-reporting:
    name: Generate PCI DSS Compliance Report
    runs-on: ubuntu-latest
    needs: [requirement-1, requirement-2, requirement-3, requirement-4, requirement-5, requirement-6]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all PCI DSS results
        uses: actions/download-artifact@v4
        with:
          name: pci-requirement-1-results

      - name: Download requirement 2 results
        uses: actions/download-artifact@v4
        with:
          name: pci-requirement-2-results

      - name: Download requirement 3 results
        uses: actions/download-artifact@v4
        with:
          name: pci-requirement-3-results

      - name: Download requirement 4 results
        uses: actions/download-artifact@v4
        with:
          name: pci-requirement-4-results

      - name: Download requirement 5 results
        uses: actions/download-artifact@v4
        with:
          name: pci-requirement-5-results

      - name: Download requirement 6 results
        uses: actions/download-artifact@v4
        with:
          name: pci-requirement-6-results

      - name: Generate comprehensive PCI DSS report
        run: |
          python scripts/compliance/generate_pci_dss_report.py \
            --requirement-1-report requirement-1-report.json \
            --requirement-2-report requirement-2-report.json \
            --requirement-3-report requirement-3-report.json \
            --requirement-4-report requirement-4-report.json \
            --requirement-5-report requirement-5-report.json \
            --requirement-6-report requirement-6-report.json \
            --output pci-dss-comprehensive-report.json

      - name: Generate PCI DSS compliance dashboard
        run: |
          python scripts/compliance/generate_pci_dashboard.py \
            --report pci-dss-comprehensive-report.json \
            --output pci-dss-dashboard.html

      - name: Upload comprehensive PCI DSS report
        uses: actions/upload-artifact@v4
        with:
          name: pci-dss-comprehensive-report
          path: |
            pci-dss-comprehensive-report.json
            pci-dss-dashboard.html

      - name: Send PCI DSS compliance notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#compliance'
          text: 'PCI DSS compliance assessment completed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # PCI DSS Compliance Quality Gates
  pci-compliance-quality-gates:
    name: PCI DSS Compliance Quality Gates
    runs-on: ubuntu-latest
    needs: [pci-compliance-reporting]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download comprehensive report
        uses: actions/download-artifact@v4
        with:
          name: pci-dss-comprehensive-report

      - name: Run PCI DSS compliance quality gates
        run: |
          python scripts/compliance/run_pci_compliance_quality_gates.py \
            --report pci-dss-comprehensive-report.json \
            --framework PCI_DSS \
            --threshold 90

      - name: Generate PCI DSS compliance score
        run: |
          COMPLIANCE_SCORE=$(python scripts/compliance/calculate_pci_compliance_score.py --report pci-dss-comprehensive-report.json)
          echo "PCI DSS Compliance Score: $COMPLIANCE_SCORE%"
          
          if (( $(echo "$COMPLIANCE_SCORE < 90" | bc -l) )); then
            echo "❌ PCI DSS compliance score below threshold: $COMPLIANCE_SCORE%"
            exit 1
          fi
          echo "✅ PCI DSS compliance score: $COMPLIANCE_SCORE%" 